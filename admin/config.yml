backend:
  name: git-gateway
  branch: main

media_folder: "site_files/images/works"
public_folder: "/images/works"

collections:
  - name: "artworks"
    label: "Artworks"
    label_singular: "Artwork"
    folder: "site_files/_artworks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Medium"
        name: "medium"
        widget: "select"
        options:
          - "Watercolour"
          - "Oil"
          - "Mixed media"
          - "Digital & mixed"
      - { label: "Year", name: "year", widget: "number",
          value_type: "int", min: 2000, max: 2100 }
      - { label: "Width (cm)", name: "width",
          widget: "number", value_type: "float",
          hint: "In centimetres" }
      - { label: "Height (cm)", name: "height",
          widget: "number", value_type: "float",
          hint: "In centimetres" }
      - { label: "Description", name: "description",
          widget: "text" }
      - { label: "Artwork image", name: "image",
          widget: "image" }
      - { label: "Feature on home page?", name: "featured",
          widget: "boolean", default: false }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - "watercolour"
          - "oil"
          - "mixed"
          - "commission"
